<!DOCTYPE html>
<html lang="el">
<head>
    <title>Σύνδεση Διαχειριστή</title>
    <link rel="stylesheet" href="/static/output.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="flex flex-col justify-center items-center bg-[#f3f4f1] min-h-screen font-sans">
    
    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-[#2f3517] p-8 text-center">
            <h1 class="text-2xl font-black text-white uppercase tracking-tighter pointer-events-none">
                29 Μ/Π ΤΑΞ <span class="text-[#c5d1ad]">Admin</span>
            </h1>
            <p class="text-[#c5d1ad] text-xs font-bold uppercase mt-1 tracking-widest">Πύλη Διαχείρισης</p>
        </div>

        <div class="p-8">
            <h2 class="text-lg font-bold text-gray-800 mb-6 text-center">Σύνδεση στο Σύστημα</h2>
            
            {% if error %}
                <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-md">
                    <p class="text-red-700 text-sm font-bold">{{ error }}</p>
                </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                <div class="space-y-1">
                    <label class="text-xs font-black uppercase text-gray-400 tracking-wider">Όνομα χρήστη</label>
                    <input type="text" name="username" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#556b2f] focus:border-transparent outline-none transition-all"
                           placeholder="π.χ. admin_canteen">
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-black uppercase text-gray-400 tracking-wider">Κωδικός πρόσβασης</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#556b2f] focus:border-transparent outline-none transition-all"
                           placeholder="••••••••">
                </div>
                
                <button type="submit" 
                        class="w-full bg-[#556b2f] hover:bg-[#3f471f] text-white font-black py-4 rounded-lg shadow-lg transform active:scale-[0.98] transition-all uppercase tracking-widest mt-4">
                    Είσοδος
                </button>
            </form>
        </div>

        <div class="bg-gray-50 p-4 border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                Σύστημα Διαχείρισης κυλικείου
            </p>
        </div>
    </div>

</body>
</html>
