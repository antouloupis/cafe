{% extends "base_admin.html" %}

{% block content %}
<!-- Filter Tabs -->
<div class="flex gap-2 mb-6">
    <a href="?status=pending" class="px-4 py-2 {% if current_status == 'pending' %}bg-[#556b2f] text-white{% else %}bg-white{% endif %}">Active</a>
    <a href="?status=completed" class="px-4 py-2 {% if current_status == 'completed' %}bg-[#556b2f] text-white{% else %}bg-white{% endif %}">Completed</a>
    <a href="?status=all" class="px-4 py-2 {% if current_status == 'all' %}bg-[#556b2f] text-white{% else %}bg-white{% endif %}">History</a>
</div>

<div class="flex gap-10 justify-between px-5">
<section class="w-1/3 overflow-y-auto border-r" id="master-pane">
    <div id="admin-orders-list"
        class="flex-grow overflow-y-auto"
        hx-get="/admin/orders?status={{ current_status }}" 
        hx-trigger="every 10s"
        hx-swap="innerHTML">
        {% include "partials/admin_orders_list.html" %}
    </div>
</section>
<section id="detail-pane" class="w-full">
    <div class="text-gray-400">Select an order to view details</div>
</section>
</div>

{% endblock content %}
