<div class="space-y-5">
    <div class="flex items-start justify-between gap-4 border-b border-gray-200 pb-4">
        <div>
            <h3 class="text-2xl font-extrabold uppercase text-[#2f3517]">{{ product.name }}</h3>
            <p class="text-gray-800 mt-1">€ {{ "%.2f"|format(product.price) }}</p>
        </div>
        <button onclick="document.getElementById('modal').style.display='none'"
                class="text-2xl text-gray-500 hover:text-black" type="button">✕</button>
    </div>

{% if product.options %}
<div>
    <h4 class="text-2xl font-bold uppercase tracking-[0.2em] text-gray-500 mb-3 text-center">Επιλογές</h4>
    
    <div class="space-y-6">
        {% for group in product.options | groupby('group_name') %}
            <div class="option-group">
                <h5 class="text-xl font-black uppercase tracking-widest text-[#556b2f] mb-2 px-1">
                    {{ group.grouper }}
                </h5>
                
                <div class="space-y-2">
                    {% for opt in group.list %}
                    <label class="flex items-center justify-between border border-gray-200 bg-white px-4 py-3 cursor-pointer hover:bg-gray-50 transition-colors shadow-sm">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" name="extras" value="{{ opt.id }}" class="h-4 w-4 accent-[#556b2f]">
                            <p class="font-semibold text-[#2f3517]">{{ opt.value }}</p>
                        </div>
                        {% if opt.extra_price > 0 %}
                        <span class="font-bold text-[#2f3517]">+€{{ "%.2f"|format(opt.extra_price) }}</span>
                        {% endif %}
                    </label>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endif %}

    <button hx-post="/add-to-cart/{{ product.id }}"
            hx-target="#modal-body"
            hx-include="[name='extras']"
            class="w-full bg-[#556b2f] text-white py-4 px-4 font-bold uppercase tracking-wider hover:opacity-95 transition cursor-pointer">
        Προσθήκη στο καλάθι
    </button>
</div>
