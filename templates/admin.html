<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <script src="/static/htmx.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000;">
        <h1>Admin Control Panel</h1>
        <a href="/logout" style="color: red;">Logout</a>
    </div>

    <h3>Inventory Management</h3>
    <p>Welcome to the secure zone. Only cookie-holders are allowed here.</p>
    {% for product in products %}
    <div id="product-row-{{ product.id }}" class="summary-row" style="display: flex; justify-content: space-between; padding: 15px; border: 1px solid #ccc;">
    
    <div>
        <strong>{{ product.name }}</strong> | {{ product.category }}
    </div>
    <div>${{ product.price / 100 }}</div>
    
    <button hx-get="/admin/product/{{ product.id }}/edit" 
            hx-target="#product-row-{{ product.id }}" 
            hx-swap="outerHTML">
        Edit Product
    </button>
</div>
{% endfor %}
    </body>
</html>
