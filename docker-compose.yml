services:
  fastapi:
    build: .
    container_name: cafe_webapp
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    ports: 
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    env_file:
      - .env
    depends_on:
      - fastapi